name = "快速"
description = "面向琐碎卡片的极简流程：不写规格、不做计划、不派发子代理。执行代理直接依据卡片实现、验证并合并。由 classify-task 路由到 `trivial` 层级。任何超出琐碎改动的部分都选择上报，绝不硬写下去。"

[[stage]]
id = "orchestrate"
label = "编排驱动"
default_enabled = false
prompt = "让编排器代理接手这张卡片，自主推进到完成。按顺序执行卡片的各个流水线阶段，无论卡片当前位于看板的哪一列，甚至可以从 Todo 列启动。"

[[stage]]
id = "implement"
label = "直接实现"
default_enabled = true
prompt = "直接根据卡片描述实现这张卡片。不要编写 SPEC.md 或 IMPLEMENTATION_PLAN.md，也不要派发规格或计划子代理。这张卡片已被判定为琐碎（trivial），描述本身就是任务说明。保持 diff 最小化，只改动卡片明确点名的部分。接下来验证：运行项目的标准检查（构建、测试、lint，以仓库指南命名的为准），再加上针对卡片自身主张最直接的手工检查，并修复你弄坏的东西。上报触发线：如果工作中发现这并不是琐碎改动，就立即停下，不要硬写下去。属于这种情况的信号有：根因在别处；需要改动的文件超过约 3 个；出现了悬而未决的设计决策。停下时先提交所有安全的进行中工作以免丢失，保持工作树其余部分干净。然后让你的最终消息的第一行恰好是 `VK-ESCALATE: trivial->light — <one-line evidence>`；如果发现的问题明显更大，就改用 `trivial->medium`。编排器会接手处理这个标记，并把卡片重新路由到更完整的流水线。发出该标记后，不要再推进任何后续阶段。"

[[stage]]
id = "code-review"
label = "Codex 评审"
default_enabled = false
prompt = "实现完成后，对卡片的 diff 运行一次独立的 Codex 评审（`codex-review` 技能 / Codex CLI）。反复迭代，直到不再报告重大发现。处理完已确认的发现并重新验证之后，才能把卡片标记为就绪。"

[[stage]]
id = "merge"
label = "合并到基础分支"
default_enabled = true
prompt = "工作实现并评审完毕后，由你亲自把这张卡片的分支 squash 合并到基础分支。本阶段被列出，就是对你的授权，不要再等待额外批准。需要人工审批时，那是等待批准（Wait-for-approval）阶段的职责。"

[[stage]]
id = "pr"
label = "创建 Pull Request"
default_enabled = false
prompt = "工作实现并评审完毕后，针对基础分支为这张卡片创建一个 pull request。"
