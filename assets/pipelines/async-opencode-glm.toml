name = "异步 OpenCode GLM"
description = "面向 OpenCode (GLM-5.2) 执行代理的自驱动异步流程：主循环亲自撰写规格、计划与代码，因为 OpenCode 会话无法派发插件的 Claude 子代理。Codex 评审计划（需要人工审批时设把关阶段），并可选地评审 diff。用 OpenCode 执行代理的 GLM-5.2 profile 运行本流水线。OpenCode 流水线只使用 MiniMax / GLM / Kimi 模型，绝不混入 Claude 模型（Codex 是两个家族共用的评审者）。"

[[stage]]
id = "orchestrate"
label = "编排驱动"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "spec"
label = "自行编写规格"
default_enabled = true
prompt = "第一步，检查卡片描述。如果它已经包含完整规格，就直接沿用。完整规格的判定条件如下，三者缺一不可：`### Outcome`、`### Scope` 和 `### Testing & acceptance criteria` 各自出现在某一行的行首，前缀匹配即可；并且这些标题不在围栏代码块或引用块内。任何一条不满足，就执行下面的“否则”分支。沿用时的写法：在工作区根目录写入 `SPEC.md`，内容恰好为：一行 `## Task: <the card's title, verbatim>`，然后一个空行，然后逐字照抄卡片描述。接着剥离 `## Pipeline` 块，以独立成行的 `<!-- vk:pipeline:start -->` / `<!-- vk:pipeline:end -->` 标记行为锚点：删除两者之间的所有内容，包括两行标记；普通文本行中提到的标记不是分隔符。然后把剥离后多余空行压成一个，并清扫任何遗留在块外的残留 executor-pin 行。不要编辑、重写或重新验证被复制的文本。把卡片已做的决定视为已定的决定，不要重新讨论或推翻，报告 \"spec adopted from card description\"，然后继续。否则执行以下流程：亲自把技术规格写到工作区根目录的 `SPEC.md`。依据是卡片描述加上快速的仓库查阅。覆盖结果、范围、技术要求以及测试与验收标准。卡片已做的决定视为已定的决定，不要重新讨论或推翻。"

[[stage]]
id = "plan"
label = "自行编写计划"
default_enabled = true
prompt = "亲自把 `SPEC.md` 转化为工作区根目录的分步 `IMPLEMENTATION_PLAN.md`，以真实仓库文件为依据。内容包含 Goal、Approach、按序排列的 Steps（每一步点名它触达的真实 `files:` 和一个可观察的 `done-when:` 检查）、Verification，以及 Risks / open questions。计划写好后，对它进行度量并报告单行 `PLAN-FACTS: <size> KB, <n> steps, <n> files, <n> open decisions`，接下来两个阶段会读取这一行。"

[[stage]]
id = "plan-review-codex"
label = "Codex 计划评审"
default_enabled = true
prompt = "第一步，先过把关阶段。读取计划阶段的 PLAN-FACTS 行；若缺失，就自己度量 `IMPLEMENTATION_PLAN.md`。跳过本阶段的条件如下，三者同时满足才跳过：计划小于 40 KB；未决决策为 0；卡片的 **Routing:** 行（如果带有）没有用 plan-review: yes 强制评审。满足就跳过本阶段，报告单行 `PLAN-GATE: plan-review skipped (<size> KB, <n> open decisions)` 并继续。理由：一个小而封闭的计划不值得独立评审，独立评审的开销通常比计划本身还大。否则报告 `PLAN-GATE: plan-review running (<size> KB, <n> open decisions)` 并继续，让 Codex 独立评审 `IMPLEMENTATION_PLAN.md`（对计划执行 `codex exec --sandbox read-only`——不要亲自评审）。迭代直到 Codex 不再报告重大发现，最多两轮评审。第二轮之后仍未解决的发现，说明计划（或其上的规格）范围有问题：要么修订计划（重跑计划阶段），要么上报。绝不支付第三轮。在编写任何代码之前，先通过修订计划解决已确认的发现。这是只读的计划评审：不要在此处修改代码。"

[[stage]]
id = "implement"
label = "自行实现"
default_enabled = true
prompt = "亲自实现这张卡片，严格依据 `SPEC.md` 和 `IMPLEMENTATION_PLAN.md`，逐步进行。每一步都要运行它的 `done-when:` 检查，边做边提交，推进前先运行项目自身的检查。在这条流水线上你就是编码者：单模型 OpenCode 会话，没有可派发的 coder 子代理，也没有可借用的跨家族模型。如果工作超出卡片的 Routing 层级（一个未定价的设计决策，或远超计划的范围），就提交安全的工作，然后上报：把 `VK-ESCALATE: <tier>-><proposed-tier> — <evidence>` 放在第一行，不要硬写下去。"

[[stage]]
id = "code-review"
label = "Codex 评审"
default_enabled = false
prompt = "实现完成后，对卡片的 diff 运行一次独立的 Codex 评审（`codex-review` 技能 / Codex CLI）。迭代直到不再报告重大发现，最多两轮。第二轮之后仍未解决的发现是范围问题，不是评审问题：修复已确认的，报告剩余的，然后继续。处理完已确认的发现并重新验证之后，才能把卡片标记为就绪。"

[[stage]]
id = "merge"
label = "合并到基础分支"
default_enabled = true
prompt = "工作实现并评审完毕后，由你亲自把这张卡片的分支 squash 合并到基础分支。本阶段被列出，就是对你的授权，不要再等待额外批准。需要人工审批时，那是等待批准（Wait-for-approval）阶段的职责。"

[[stage]]
id = "pr"
label = "创建 Pull Request"
default_enabled = false
prompt = "工作实现并评审完毕后，针对基础分支为这张卡片创建一个 pull request。"
